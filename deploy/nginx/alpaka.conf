# Nginx untuk Sistem Loyalty Alpaka (production).
#  - Melayani frontend hasil build (frontend/dist) sebagai SPA
#  - Meneruskan /api ke backend Node (BACKEND_PORT, default 9721)
#  - HTTPS wajib (NFR-01): HTTP dialihkan ke HTTPS. Sertifikat: certbot --nginx -d loyalty.example.com
# Ganti: loyalty.example.com, path root, dan path sertifikat. Uji dengan: sudo nginx -t
# Di .env backend production: NODE_ENV=production, FORCE_HTTPS=true, CORS_ORIGIN=https://loyalty.example.com,
#                              APP_URL=https://loyalty.example.com

server {
    listen 80;
    server_name loyalty.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name loyalty.example.com;

    ssl_certificate     /etc/letsencrypt/live/loyalty.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loyalty.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/alpaka/frontend/dist;
    index index.html;

    # Batas upload struk (samakan dengan pengaturan ukuran file x jumlah file, +margin)
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:9721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Wajib: backend memakai header ini untuk mengenali koneksi HTTPS (FORCE_HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File build ber-hash: cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rute tak dikenal jatuh ke index.html (jangan di-cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
